<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>potsg — Steven Claros</title>
        <link rel="stylesheet" href="../../styles.css" />
        <script src="../../script.js" defer></script>
    </head>
    <body>
        <div class="site-shell">
            <aside class="sidebar">
                <div class="dashboard-header">
                    <a class="brand" href="/"
                        ><span class="full-brand">steven claros</span
                        ><span class="mini-brand">sc</span></a
                    ><button
                        class="dashboard-toggle"
                        type="button"
                        aria-expanded="true"
                        aria-controls="dashboard"
                        aria-label="Hide dashboard"
                    >
                        <span>«</span>
                    </button>
                </div>
                <div class="dashboard-body" id="dashboard">
                    <button
                        class="menu-toggle"
                        type="button"
                        aria-expanded="true"
                        aria-controls="site-menu"
                    >
                        <span>pages</span><span class="menu-icon">−</span>
                    </button>
                    <nav class="directory is-open" id="site-menu">
                        <div class="directory-inner">
                            <a class="directory-link" href="/">home</a
                            ><a class="directory-link" href="/about/">about</a
                            ><a class="directory-link active" href="/projects/"
                                >projects</a
                            ><a class="directory-link" href="/hardware/"
                                >hardware</a
                            ><a class="directory-link" href="/contact/"
                                >contact</a
                            >
                        </div>
                    </nav>
                </div>
                <div class="sidebar-footer">
                    <p class="copyright">© 2026 Steven Claros</p>
                </div>
            </aside>
            <main class="main-content">
                <section class="page-content">
                    <p class="section-kicker">project</p>
                    <h1>potsg</h1>
                    <p>
                        This project page is ready for notes, screenshots,
                        links, and a fuller write-up.
                    </p>
                    <div
                        class="project-carousel"
                        data-carousel
                        data-image-directory=""
                        data-image-extension="png"
                        aria-label="PotSG project screenshots"
                    >
                        <button
                            class="carousel-button carousel-previous"
                            type="button"
                            aria-label="Previous screenshot"
                        >
                            ←
                        </button>
                        <div class="carousel-frame">
                            <button
                                class="carousel-image-trigger"
                                type="button"
                                aria-label="Enlarge screenshot"
                            >
                                <img
                                    class="carousel-image"
                                    src="images/0.png"
                                    alt="PotSG project screenshot 1 of 6"
                                />
                            </button>
                        </div>
                        <button
                            class="carousel-button carousel-next"
                            type="button"
                            aria-label="Next screenshot"
                        >
                            →
                        </button>
                        <p class="carousel-status" aria-live="polite">
                            01 / 06
                        </p>
                    </div>
                </section>
            </main>
        </div>
    </body>
</html>
